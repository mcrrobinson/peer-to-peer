<!doctype html>
<html><head><meta charset="utf-8"><title>WebRTC loopback flash</title>
<style>
  html, body { margin: 0; background: #404040; overflow: hidden; }
  #remote { position: absolute; left: 20px; top: 20px; width: 1280px; height: 720px; background: #000; }
  #src { position: absolute; right: 0; bottom: 0; width: 8px; height: 8px; }
  #status { position: absolute; left: 20px; top: 750px; color: #ccc; font: 14px monospace; }
</style></head>
<body>
<video id="remote" autoplay muted playsinline></video>
<canvas id="src" width="1920" height="1080"></canvas>
<div id="status">starting</div>
<script>
// Stock WebRTC loopback: two RTCPeerConnections in one page (host candidates
// over loopback UDP, Chrome's defaults for everything except an optional
// codec preference ?codec=VP8|VP9|H264|AV1|H265). The source is a 1920x1080
// canvas redrawn every frame (like p2pcall's --video-source flash), switching
// black/white every 500-900 ms; each switch's time, in CLOCK_MONOTONIC us,
// goes to the server in latency_probe's --source-log format.
const q = new URLSearchParams(location.search);
const codec = q.get('codec');
const status = (s) => document.getElementById('status').textContent = s;
let offsetUs = 0; // monotonic us - performance.now() us

async function calibrate() {
  let best = null;
  for (let i = 0; i < 30; ++i) {
    const t0 = performance.now();
    const mono = Number(await (await fetch('/now', {cache: 'no-store'})).text());
    const t1 = performance.now();
    if (!best || t1 - t0 < best.rtt) best = {rtt: t1 - t0, off: mono - (t0 + t1) * 500};
  }
  return best;
}

async function main() {
  const c0 = await calibrate();
  offsetUs = c0.off;
  const canvas = document.getElementById('src');
  const g = canvas.getContext('2d');
  let white = false, next = performance.now() + 2000, pending = [];
  const draw = () => {
    const t = performance.now();
    if (t >= next) {
      white = !white;
      next = t + 500 + Math.random() * 400;
      pending.push(`${Math.round(t * 1000 + offsetUs)} ${white ? 1 : 0}\n`);
    }
    g.fillStyle = white ? '#fff' : '#000';
    g.fillRect(0, 0, canvas.width, canvas.height);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
  setInterval(() => {
    if (!pending.length) return;
    const body = pending.join(''); pending = [];
    fetch('/log', {method: 'POST', body});
  }, 1000);

  const stream = canvas.captureStream(60);
  if (q.get('mode') === 'local') {
    // Control: the canvas stream straight into the video element, no WebRTC.
    document.getElementById('remote').srcObject = stream;
    fetch('/info', {method: 'POST', body: `mode local\ncalibration rtt ${c0.rtt.toFixed(3)} ms\n`});
    status('local control (no WebRTC)');
    return;
  }
  const pc1 = new RTCPeerConnection(), pc2 = new RTCPeerConnection();
  pc1.onicecandidate = e => e.candidate && pc2.addIceCandidate(e.candidate);
  pc2.onicecandidate = e => e.candidate && pc1.addIceCandidate(e.candidate);
  pc2.ontrack = e => { document.getElementById('remote').srcObject = e.streams[0]; };
  const tr = pc1.addTransceiver(stream.getVideoTracks()[0], {direction: 'sendonly', streams: [stream]});
  if (codec) {
    const all = RTCRtpReceiver.getCapabilities('video').codecs;
    const pick = all.filter(x => x.mimeType.toLowerCase() === 'video/' + codec.toLowerCase());
    if (!pick.length) { status('codec not available: ' + codec); return; }
    tr.setCodecPreferences(pick.concat(all.filter(x => /rtx|red|ulpfec|flexfec/i.test(x.mimeType))));
  }
  await pc1.setLocalDescription();
  await pc2.setRemoteDescription(pc1.localDescription);
  await pc2.setLocalDescription();
  await pc1.setRemoteDescription(pc2.localDescription);

  fetch('/info', {method: 'POST', body: `ua ${navigator.userAgent}\ncodec-pref ${codec || 'default'}\ncalibration rtt ${c0.rtt.toFixed(3)} ms\n` +
    `send codecs ${RTCRtpSender.getCapabilities('video').codecs.map(x => x.mimeType + (x.sdpFmtpLine ? '(' + x.sdpFmtpLine + ')' : '')).join(' ')}\n`});

  setInterval(async () => {
    const out = {t: Math.round(performance.now() * 1000 + offsetUs)};
    (await pc2.getStats()).forEach(r => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') out.in = {
        w: r.frameWidth, h: r.frameHeight, fps: r.framesPerSecond, decoded: r.framesDecoded, dropped: r.framesDropped,
        bytes: r.bytesReceived, lost: r.packetsLost, freezes: r.freezeCount, jb: r.jitterBufferDelay, jbn: r.jitterBufferEmittedCount,
        dec: r.totalDecodeTime, impl: r.decoderImplementation, hw: r.powerEfficientDecoder, codecId: r.codecId};
      if (r.type === 'codec') out['codec_' + r.id] = r.mimeType;
    });
    (await pc1.getStats()).forEach(r => {
      if (r.type === 'outbound-rtp' && r.kind === 'video') out.out = {
        w: r.frameWidth, h: r.frameHeight, fps: r.framesPerSecond, encoded: r.framesEncoded, enc: r.totalEncodeTime,
        target: r.targetBitrate, impl: r.encoderImplementation, hw: r.powerEfficientEncoder, ql: r.qualityLimitationReason,
        sendDelay: r.totalPacketSendDelay, packets: r.packetsSent};
      if (r.type === 'candidate-pair' && r.nominated) out.rtt = r.currentRoundTripTime;
    });
    fetch('/stats', {method: 'POST', body: JSON.stringify(out) + '\n'});
    if (out.in) status(`${codec || 'default'} ${out.in.w}x${out.in.h} ${out.in.fps} fps, decoder ${out.in.impl}, encoder ${out.out && out.out.impl}`);
  }, 1000);
}
main().catch(e => status('error: ' + e));
</script>
</body></html>
